services:
  db:
    image: mysql:8.0
    container_name: lvaep_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lvaep}
      MYSQL_USER: ${MYSQL_USER:-lvaep_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lvaep_app_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  db_data:
